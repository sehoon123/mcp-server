name: Preflight Dependabot release credential

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected-main commit that will become the release candidate
        required: true
        type: string

permissions: {}

concurrency:
  group: release-dependabot-preflight-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  identity:
    name: Validate exact protected-main identity
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require this workflow to run at the requested main commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "sehoon123/mcp-server" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_SHA" == "$SOURCE_COMMIT" ]]

  dependabot-alerts:
    name: Validate dedicated Dependabot-alerts credential
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-dependabot-read
    permissions: {}
    steps:
      - name: Fetch, minimize, and validate authenticated open alerts
        env:
          DEPENDABOT_ALERTS_READ_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_READ_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "sehoon123/mcp-server" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$SOURCE_COMMIT" ]]
          if [[ -z "${DEPENDABOT_ALERTS_READ_TOKEN:-}" ]]; then
            echo 'DEPENDABOT_ALERTS_READ_TOKEN is not provisioned' >&2
            exit 1
          fi
          gh_config="$RUNNER_TEMP/empty-gh-config"
          install -d -m 700 "$gh_config"
          env -u GITHUB_TOKEN \
            GH_CONFIG_DIR="$gh_config" GH_TOKEN="$DEPENDABOT_ALERTS_READ_TOKEN" \
            gh api -H 'X-GitHub-Api-Version: 2022-11-28' --paginate --slurp \
              'repos/sehoon123/mcp-server/dependabot/alerts?state=open&per_page=100' \
              > "$RUNNER_TEMP/dependabot-pages.json"
          jq -e '
            if type == "array" and all(.[]; type == "array") then add
            else error("Dependabot pagination response is not an array of pages") end |
            map({
              number,
              state,
              dependency: {
                package: {ecosystem: .dependency.package.ecosystem, name: .dependency.package.name},
                manifest_path: .dependency.manifest_path,
                scope: .dependency.scope,
                relationship: .dependency.relationship
              },
              security_advisory: {
                severity: .security_advisory.severity,
                ghsa_id: .security_advisory.ghsa_id
              },
              security_vulnerability: {
                package: {
                  ecosystem: .security_vulnerability.package.ecosystem,
                  name: .security_vulnerability.package.name
                },
                vulnerable_version_range: .security_vulnerability.vulnerable_version_range,
                first_patched_version: {
                  identifier: .security_vulnerability.first_patched_version.identifier
                }
              }
            })
          ' "$RUNNER_TEMP/dependabot-pages.json" > "$RUNNER_TEMP/dependabot-alerts.json"
          jq -e '
            length == 1 and
            .[0].number == 31 and .[0].state == "open" and
            .[0].dependency.package.ecosystem == "npm" and
            .[0].dependency.package.name == "@hono/node-server" and
            .[0].dependency.manifest_path == ".github/conformance/package-lock.json" and
            .[0].dependency.scope == "development" and
            .[0].dependency.relationship == "transitive" and
            .[0].security_advisory.severity == "medium" and
            .[0].security_advisory.ghsa_id == "GHSA-frvp-7c67-39w9" and
            .[0].security_vulnerability.package.ecosystem == "npm" and
            .[0].security_vulnerability.package.name == "@hono/node-server" and
            .[0].security_vulnerability.vulnerable_version_range == "< 2.0.5" and
            .[0].security_vulnerability.first_patched_version.identifier == "2.0.5"
          ' "$RUNNER_TEMP/dependabot-alerts.json" >/dev/null || {
            echo 'expected exactly reviewed Dependabot alert 31' >&2
            exit 1
          }
          {
            echo '## Dependabot release credential preflight'
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Source commit: $SOURCE_COMMIT"
            echo '- Dedicated credential: authenticated and policy-compatible'
            echo '- Reviewed open alert count: 1'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload minimized preflight snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-preflight-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/dependabot-alerts.json
          if-no-files-found: error
          retention-days: 1
