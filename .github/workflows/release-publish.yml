                "rcAssetSnapshotSha256", "rcJarSha256", "rcPublishedAt", "rcReleaseId", "rcSourceCommit",
                "rcTag", "repository", "requiredLabels", "schemaVersion"] and
              .schemaVersion == 1 and .repository == $repo and .rcTag == $rcTag and .baseVersion == $version and
