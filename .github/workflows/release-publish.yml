            content_at "$SOURCE_COMMIT" BappManifest.bmf "$observation_dir/manifest.stable"
            [[ $(grep -c '^ScreenVersion:' "$observation_dir/manifest.rc") -eq 1 ]]
            [[ $(grep -c '^ScreenVersion:' "$observation_dir/manifest.stable") -eq 1 ]]
            [[ $(grep -c '^SerialVersion:' "$observation_dir/manifest.rc") -eq 1 ]]
            [[ $(grep -c '^SerialVersion:' "$observation_dir/manifest.stable") -eq 1 ]]
            grep -Fx "ScreenVersion: ${OBSERVED_RC_TAG#v}" "$observation_dir/manifest.rc" >/dev/null
            grep -Fx "ScreenVersion: $stable_version" "$observation_dir/manifest.stable" >/dev/null
            rc_serial=$(awk '/^SerialVersion:/ {print $2}' "$observation_dir/manifest.rc")
            stable_serial=$(awk '/^SerialVersion:/ {print $2}' "$observation_dir/manifest.stable")
