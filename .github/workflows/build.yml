name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/streamable-http, perf/runtime-optimization, feat/stable-history-access, feat/http-message-search]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          validate-wrappers: true

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/conformance/package-lock.json

      - name: Install pinned conformance CLIs without lifecycle scripts
        run: |
          npm ci --ignore-scripts --prefix .github/conformance
          npm audit --audit-level=high --package-lock-only --prefix .github/conformance

      - name: Validate proxy update source guards
        run: |
          bash -n scripts/update-proxy.sh scripts/test-update-proxy-guards.sh
          scripts/test-update-proxy-guards.sh

      - name: Run tests
        run: ./gradlew test

      - name: Run official MCP conformance checks
        shell: bash
        run: |
          set -uo pipefail
          server_log="$RUNNER_TEMP/mcp-conformance-server.log"
          MCP_CONFORMANCE_PORT=19877 ./gradlew runConformanceServer --no-daemon >"$server_log" 2>&1 &
          server_pid=$!
          # shellcheck disable=SC2317
          cleanup() {
            pkill -TERM -P "$server_pid" 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            code=$(curl --silent --show-error --max-time 1 --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:19877/mcp \
              --header 'Content-Type: application/json' \
              --header 'Accept: application/json, text/event-stream' \
              --data-binary '{}' 2>/dev/null || true)
            if [[ "$code" != "000" ]]; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat "$server_log"
            exit 1
          fi

          status=0
          for scenario in \
            server-initialize ping tools-list \
            resources-list resources-read-text resources-templates-read \
            prompts-list prompts-get-simple prompts-get-with-args \
            dns-rebinding-protection server-sse-multiple-streams; do
            node .github/conformance/node_modules/mcp-conformance-stable/dist/index.js server \
              --url http://127.0.0.1:19877/mcp \
              --scenario "$scenario" \
              --verbose || status=1
          done

          # The modern per-request protocol is intentionally unsupported by the production SDK. Keep a
          # stale-sensitive expected-failure baseline so an SDK upgrade cannot silently change that status.
          node .github/conformance/node_modules/mcp-conformance-modern/dist/index.js server \
            --url http://127.0.0.1:19877/mcp \
            --scenario server-stateless \
            --expected-failures .github/conformance-expected-failures.yml \
            --verbose || status=1

          if [[ "$status" -ne 0 ]]; then
            cat "$server_log"
          fi
          exit "$status"

      - name: Build extension JAR and SBOM
        run: ./gradlew embedProxyJar generateSbom

      - name: Validate CycloneDX 1.6 SBOM schema
        shell: bash
        run: |
          (
            cd .github/schemas
            grep -E '^[a-f0-9]{64}  [^ ]+$' README.md | sha256sum -c -
          )
          node .github/conformance/validate-sbom.mjs .github/schemas build/reports/compliance/bom.cdx.json

      - name: Verify SBOM configuration-cache reuse
        shell: bash
        run: |
          output=$(./gradlew embedProxyJar generateSbom)
          printf '%s\n' "$output"
          grep -F 'Configuration cache entry reused.' <<<"$output"

      - name: Verify reproducible extension JAR and SBOM
        shell: bash
        run: |
          cp build/libs/independent-mcp-bridge-all.jar "$RUNNER_TEMP/independent-mcp-bridge-first.jar"
          cp build/reports/compliance/bom.cdx.json "$RUNNER_TEMP/bom-first.cdx.json"
          ./gradlew embedProxyJar generateSbom --rerun-tasks
          cmp "$RUNNER_TEMP/independent-mcp-bridge-first.jar" build/libs/independent-mcp-bridge-all.jar
          cmp "$RUNNER_TEMP/bom-first.cdx.json" build/reports/compliance/bom.cdx.json

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7

      - name: Stage and verify exact CI distribution
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/ci-distribution"
          mkdir -p "$stage/legal/licenses" "$stage/docs"
          cp build/libs/independent-mcp-bridge-all.jar build/reports/compliance/bom.cdx.json "$stage/"
          cp LICENSE NOTICE.md FORK_NOTICE.md THIRD_PARTY_NOTICES.md CORRESPONDING_SOURCE.md "$stage/"
          cp legal/runtime-licenses.properties "$stage/legal/"
          cp legal/licenses/Apache-2.0.txt legal/licenses/MIT-SLF4J.txt "$stage/legal/licenses/"
          cp docs/VULNERABILITY_REPORT.md "$stage/docs/"
          expected=$(cat <<'EOF'
          CORRESPONDING_SOURCE.md
          FORK_NOTICE.md
          LICENSE
          NOTICE.md
          THIRD_PARTY_NOTICES.md
          bom.cdx.json
          docs/VULNERABILITY_REPORT.md
          independent-mcp-bridge-all.jar
          legal/licenses/Apache-2.0.txt
          legal/licenses/MIT-SLF4J.txt
          legal/runtime-licenses.properties
          EOF
          )
          actual=$(cd "$stage" && find . -type f -print | sed 's#^\./##' | LC_ALL=C sort)
          diff -u <(printf '%s\n' "$expected" | sed 's/^          //' | LC_ALL=C sort) <(printf '%s\n' "$actual")

      - name: Upload extension JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: independent-mcp-bridge-extension
          path: ${{ runner.temp }}/ci-distribution/
          if-no-files-found: error
          retention-days: 30
