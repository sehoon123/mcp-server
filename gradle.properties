kotlin.code.style=official
# Incremental and clean Kotlin compilation can emit different debug line tables for identical sources.
kotlin.incremental=false
kotlin.stdlib.default.dependency=false
group=io.github.sehoon123
version=4.11.0-rc.3
description=Independent MCP Bridge for Burp Suite
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.file.encoding=UTF-8
java.toolchain.version=21
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
